name: FRIEZE Diagnostic (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install isolated diagnostic dependencies
        run: python -m pip install requests beautifulsoup4 playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compare HTTP and browser access (no database)
        if: ${{ !cancelled() }}
        run: python -u scripts/frieze_diagnostic.py
      - name: Save diagnostic report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: frieze-diagnostic-results
          path: frieze-diagnostic-results/
          if-no-files-found: warn
          retention-days: 7
